name: Explicit pre-merge historical replay proof v0.0.2.8
on:
  push:
    branches: [audit/v0.0.2.8-historical-replay-proof]
permissions:
  contents: read
jobs:
  review:
    if: github.event.repository.private == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ce5f2d77c3f553d702718e27de82cd9e3ea3a178
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify historical checkout identity
        shell: bash
        run: |
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/audit/v0.0.2.8-historical-replay-proof
          test "$(git rev-parse HEAD)" = ce5f2d77c3f553d702718e27de82cd9e3ea3a178
          test "$(git rev-parse HEAD^{tree})" = b3631b8cade61a802d0c0d8c9180b141e5a07c11
          echo "Historical source: $(git rev-parse HEAD); dispatch source: $GITHUB_SHA"
          python --version
          git --version
      - name: Verify exact prospective scope and actual package
        run: python licensing/v0.0.2.7/verify_operative.py
      - name: Reject uncommitted baseline changes before import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          path = Path("packages/provenistem/tools/library.py")
          original = path.read_bytes()
          try:
              path.write_bytes(original + b"\nraise RuntimeError('tampered module imported')\n")
              result = subprocess.run([sys.executable, "licensing/v0.0.2.7/verify_operative.py"],
                                      capture_output=True, text=True, timeout=30)
              if (result.returncode == 0 or "changed working-tree baseline: packages/provenistem/tools/library.py" not in result.stderr
                      or "RuntimeError: tampered module imported" in result.stderr or "OPERATIVE_CANDIDATE_PASS" in result.stdout):
                  raise RuntimeError("dirty baseline rejection failed: " + result.stderr)
              print("DIRTY_BASELINE_REJECTED before importing product code")
          finally:
              path.write_bytes(original)
          PY
      - name: Existing portable package regression suite
        working-directory: packages/provenistem
        run: python -m unittest discover -s tests -v
      - name: Verify full isolated copied package
        working-directory: packages/provenistem
        run: python ../../audit/verify_adoption_copy.py
      - name: Verify clean checkout
        shell: bash
        run: test -z "$(git status --porcelain)"
