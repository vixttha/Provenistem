name: Provenistem Graphify archives

on:
  push:
    branches: [Veraphify]
  pull_request:
    branches: [Veraphify]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Install the pinned Graphify producer
        run: |
          kit="$RUNNER_TEMP/graphify-kit"
          producer=6af3c2025be3f51e02dca4e4502088c526aae6d1
          git init -q "$kit"
          git -C "$kit" fetch -q --no-tags --depth=1 https://github.com/vixttha/Blender-Agent-Refinement-Toolkit.git "$producer"
          git -C "$kit" checkout -q --detach "$producer"
          test "$(git -C "$kit" rev-parse HEAD)" = "$producer"
          python -m pip install --require-hashes --no-cache-dir --only-binary=:all: --no-deps -r "$kit/versions/v0.0.8/requirements.txt"
          python -m pip check
      - name: Check the branch-local Provenistem starter
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python provenistem/tools/library.py check --expect-empty
      - name: Verify standalone runtime provenance
        run: python scripts/verify-runtime.py
      - name: Build, replay, and verify six version archives
        run: bash scripts/build-archives.sh "$RUNNER_TEMP/graphify-kit/versions/v0.0.8" "$RUNNER_TEMP/provenistem-evidence"
      - name: Check all committed maps and durable pins
        run: |
          python scripts/replay-archives.py "$RUNNER_TEMP/provenistem-evidence"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provenistem-veraphify-archives
          path: ${{ runner.temp }}/provenistem-evidence
          if-no-files-found: error
          retention-days: 30

  replay:
    needs: archive
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: provenistem-veraphify-archives
          path: ${{ runner.temp }}/provenistem-replay
      - name: Standalone replay without Graphify or product checkout
        shell: bash
        run: |
          python scripts/replay-archives.py "$RUNNER_TEMP/provenistem-replay"
          test -z "$(git status --porcelain)"
