name: Licensing candidate review v0.0.2.7
on:
  pull_request:
    branches: [main]
    paths:
      - 'licensing/v0.0.2.7/**'
      - '.github/workflows/licensing-candidate-review.yml'
  push:
    branches: [review/v0.0.2.7-licensing]
permissions:
  contents: read
jobs:
  review:
    if: github.event.repository.private == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact legal reference and review-only proposal
        run: python licensing/v0.0.2.7/verify_review.py
      - name: Reject uncommitted baseline changes before import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          path = Path("packages/provenistem/tools/library.py")
          original = path.read_bytes()
          try:
              path.write_bytes(original + b"\nraise RuntimeError('tampered module imported')\n")
              result = subprocess.run([sys.executable, "licensing/v0.0.2.7/verify_review.py"],
                                      capture_output=True, text=True, timeout=30)
              if (result.returncode == 0 or "changed working-tree baseline: packages/provenistem/tools/library.py" not in result.stderr
                      or "RuntimeError: tampered module imported" in result.stderr or "REVIEW_PASS" in result.stdout):
                  raise RuntimeError("dirty baseline rejection failed: " + result.stderr)
              print("DIRTY_BASELINE_REJECTED before importing product code")
          finally:
              path.write_bytes(original)
          PY
      - name: Existing portable package regression suite
        working-directory: packages/provenistem
        run: python -m unittest discover -s tests -v
      - name: Verify clean checkout
        shell: bash
        run: test -z "$(git status --porcelain)"
