name: Rights provenance audit v0.0.2.7
on:
  push:
    branches: [audit/v0.0.2.7-rights-provenance]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    if: github.event.repository.private == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check exact license pins and copy behavior
        run: python audit/verify_rights_provenance.py
      - name: Verify clean checkout
        shell: bash
        run: test -z "$(git status --porcelain)"
