name: Navigation RED proof
on:
  push:
    branches: [review/v0.0.2.9-clickable-navigation]
permissions:
  contents: read
jobs:
  red:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prove navigation tests fail against unchanged baseline
        shell: bash
        working-directory: packages/provenistem
        run: |
          set +e
          python -m unittest discover -s tests -p test_library.py -k navigation -v > "$RUNNER_TEMP/navigation-red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/navigation-red.log"
          test "$status" = 1
          grep -F "FAIL: test_navigation_build_resolves_records_and_preserves_bytes" "$RUNNER_TEMP/navigation-red.log"
          grep -F "FAIL: test_navigation_custom_safe_identifier" "$RUNNER_TEMP/navigation-red.log"
          grep -F "FAIL: test_navigation_unsafe_custom_id_does_not_write_indexes" "$RUNNER_TEMP/navigation-red.log"
          ! grep -E "^ERROR:|^FAILED.*errors=" "$RUNNER_TEMP/navigation-red.log"
          echo NAVIGATION_RED_EXPECTED_FAILURE
