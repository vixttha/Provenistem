name: Portable package validation

on:
  push:
    branches: [v0.0.1]
  pull_request:
    branches: [v0.0.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-package:
    name: Portable package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: packages/provenistem
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate the blank starter
        run: python tools/library.py check
      - name: Run portable package tests
        run: python -m unittest discover -s tests -v
      - name: Verify the checkout stayed clean
        shell: bash
        run: test -z "$(git status --porcelain)"
