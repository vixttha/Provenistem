name: Explicit v0.0.2.8 three-finding mutation proof GREEN
on:
  push:
    branches: [audit/v0.0.2.8-review-regression-proof]
permissions:
  contents: read
jobs:
  mutation-proof:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prove corrected checks reject each regression and verify golden index provenance
        run: python audit/legacy-review-proof.py green
