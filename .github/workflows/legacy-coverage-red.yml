name: Explicit legacy compatibility coverage RED
on:
  push:
    branches: [audit/v0.0.2.8-legacy-red]
permissions:
  contents: read
jobs:
  red:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Missing active legacy upgrade check is detected
        shell: bash
        run: |
          python - <<'PY'
          import subprocess, sys
          result = subprocess.run([sys.executable, "-m", "unittest", "discover", "-s", "audit", "-p", "test_ci_lifecycle.py", "-v"], capture_output=True, text=True)
          print(result.stdout)
          print(result.stderr)
          if result.returncode != 1 or "FAIL: test_workflow_separation" not in result.stderr or "python audit/verify_legacy_upgrade.py" not in result.stderr or "FAILED (failures=1)" not in result.stderr:
              raise SystemExit("Expected isolated RED was not observed")
          print("LEGACY_COVERAGE_RED_OBSERVED")
          PY
